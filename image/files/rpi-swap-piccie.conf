# rpi-swap's default (auto = zram+file) needs a swap file on root and
# systemd-remount-fs, neither of which exists on Piccie's read-only root, so no
# swap came up at all. RAM-only compressed swap gives Chromium headroom on long
# events without writing to the SD card.
[Main]
Mechanism=zram

[Zram]
FixedSizeMiB=1024
