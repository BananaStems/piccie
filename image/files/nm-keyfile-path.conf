[main]
plugins=keyfile
# / is read-only at runtime. Keep the resolver file itself under /run so
# NetworkManager can publish DHCP DNS immediately without trying to replace a
# file in /etc.
rc-manager=symlink

[keyfile]
# Store NetworkManager connection profiles on the writable /data partition so
# provisioned WiFi survives reboots under a read-only root (the default
# /etc/NetworkManager/system-connections is on the overlay -> tmpfs -> lost).
path=/data/system-connections
