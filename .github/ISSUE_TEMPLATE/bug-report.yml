name: Bug report
description: Something broke during an event, in Template Studio, or with guest downloads.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Start an event
        2. Tap to start
        3. ...
  - type: input
    id: version
    attributes:
      label: Piccie version and build
      description: Settings → About on the booth shows both.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you have SSH access, paste the output of `journalctl -u piccie-engine -n 200`.
      render: text
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Pi model, camera and screen, if they differ from the parts list.
