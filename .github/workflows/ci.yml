name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # the appliance image runs Python 3.13
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PICCIE_CAMERA: mock
      - run: python -m compileall -q engine
      - run: node --check web/js/studio.js && node --check web/js/screens/onboarding.js && node --check web/js/screens/templates.js && node --check web/js/screens/editor.js
      - run: node --test web/test/*.test.mjs
      # bash -n reads only its first file argument, so check one at a time.
      - run: for f in image/*.sh scripts/*.sh image/piccie-{clock-sync,performance,shutdown,restart-engine,restore-release}; do bash -n "$f" || exit 1; done
      - run: bash image/test-grow-data.sh
      - run: bash image/test-readonly-root.sh
      - run: bash image/test-performance.sh
      - run: bash image/test-shutdown.sh
      - run: bash image/test-clock-sync.sh
      - run: bash image/test-update.sh
