name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PICCIE_CAMERA: mock
      - run: python -m compileall -q engine
      - run: node --check web/js/studio.js && node --check web/js/screens/onboarding.js && node --check web/js/screens/templates.js && node --check web/js/screens/editor.js
      - run: node --test web/test/*.test.mjs
      - run: bash -n image/*.sh scripts/*.sh
      - run: bash image/test-grow-data.sh
