<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="description" content="Design a Piccie photo strip footer on your phone" />
  <meta name="theme-color" content="#fffdf9" />
  <title>Piccie Template Studio</title>
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body>
  <header class="studio-header">
    <button class="studio-name" id="studio-name" type="button" aria-label="Rename template">
      <span id="studio-name-display" class="is-placeholder">Untitled template</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/></svg>
    </button>
    <div class="studio-actions">
      <button class="icon-button" id="undo-edit" type="button" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="icon-button" id="redo-edit" type="button" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button class="studio-save" id="install-template" type="button">Save</button>
    </div>
  </header>
  <main class="studio-main">
    <section class="studio-workspace" aria-label="Template canvas">
      <div class="canvas-toolbar">
        <div class="view-switcher" role="group" aria-label="Canvas view">
          <button id="view-footer" type="button" aria-pressed="true">Footer</button>
          <button id="view-full" type="button" aria-pressed="false">Full strip</button>
        </div>
        <p class="canvas-hint" id="canvas-hint">Tap an item to edit</p>
      </div>
      <div class="strip-stage" id="strip-stage">
        <div class="strip-shell" id="strip-shell">
          <div class="studio-strip" id="studio-strip">
            <div class="photo-slot photo-one"><span>Photo 1</span></div>
            <div class="photo-slot photo-two"><span>Photo 2</span></div>
            <div class="photo-slot photo-three"><span>Photo 3</span></div>
            <div class="overlay-guide"><span>Images can reach up to here</span></div>
            <div class="footer-guide"><span>Footer</span></div>
            <div id="studio-layers"></div>
            <div class="snap-guide" id="snap-guide" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
    <aside class="studio-sheet" id="studio-sheet" aria-labelledby="sheet-title">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <header class="sheet-header">
        <h2 id="sheet-title">Template</h2>
        <button class="icon-button" id="close-sheet" type="button" aria-label="Close panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="sheet-content" id="sheet-content"></div>
    </aside>
    <nav class="studio-dock" aria-label="Add to the template">
      <button type="button" data-tool="text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V5h14v2M9 19h6M12 5v14"/></svg><span>Text</span>
      </button>
      <label class="studio-upload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-4.5-4.5-9 8"/></svg><span>Image</span>
        <input id="studio-image" type="file" accept="image/*" />
      </label>
      <button type="button" data-tool="shapes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.5"/><rect x="12" y="12" width="8.5" height="8.5" rx="1.8"/></svg><span>Shapes</span>
      </button>
      <button type="button" data-tool="design">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.1 0 1.6-.8 1.6-1.6 0-1.3-1.1-1.5-1.1-2.7 0-1 .8-1.6 1.8-1.6h2.4a3.8 3.8 0 0 0 3.8-3.8c0-4-3.8-7.3-8.5-7.3Z"/><circle cx="7.8" cy="11" r="1"/><circle cx="10.2" cy="7.4" r="1"/><circle cx="14.6" cy="7.6" r="1"/></svg><span>Template</span>
      </button>
      <button type="button" data-tool="layers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 8.5 4.7L12 13 3.5 8.2 12 3.5Z"/><path d="m3.5 12.6 8.5 4.8 8.5-4.8"/><path d="m3.5 16.6 8.5 4.8 8.5-4.8"/></svg><span>Layers</span>
      </button>
    </nav>
  </main>
  <p class="studio-status" id="studio-status" role="status" aria-live="polite"></p>
  <div class="studio-blocker" id="studio-blocker" hidden>
    <section class="blocker-card" role="alertdialog" aria-modal="true" aria-labelledby="blocker-title" aria-describedby="blocker-text">
      <h2 id="blocker-title"></h2>
      <p id="blocker-text"></p>
      <button class="studio-save" id="blocker-retry" type="button" hidden>Try again</button>
    </section>
  </div>
  <script type="module" src="/js/studio.js"></script>
</body>
</html>
