<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2ebe3">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https:; connect-src https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none';">
<title>Your photo strip | Piccie</title>
<script>
// The print plays once per strip on this phone; repeat visits and reduced motion open finished.
(() => {
  let seen = false;
  try { seen = localStorage.getItem("piccie-printed:" + location.pathname) === "1"; } catch (error) {}
  if (!seen && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("printing");
  }
})();
</script>
<style>
:root{color-scheme:light;--paper:#f2ebe3;--ink:#2d2926;--muted:#6b635b;--accent:#c45c4a;--accent-down:#a8473a;
--top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px);
--actions:calc(126px + var(--bottom));--printer-h:calc(var(--top) + 142px);--printer-w:min(calc(100vw + 24px),520px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:16px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(120% 75% at 50% 40%,#f8f3ed 0%,var(--paper) 58%,#e8dfd3 100%) fixed var(--paper)}
::selection{background:#c45c4a40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* The finished state is the default; html.printing only adds the machine and the starting positions. */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:calc(20px + var(--top)) 16px var(--actions)}
.print{width:min(calc((100vh - 20px - var(--top) - var(--actions)) / 3),100%);aspect-ratio:1/3;transform-origin:50% 0;
filter:drop-shadow(0 1px 1px rgba(45,41,38,.16)) drop-shadow(0 14px 20px rgba(45,41,38,.2))}
@supports (height:100svh){.print{width:min(calc((100svh - 20px - var(--top) - var(--actions)) / 3),100%)}}
.paper{position:relative;height:100%;overflow:hidden;background:#fff}
.paper img{display:block;width:100%;height:100%;object-fit:contain}
.haze{display:none;position:absolute;left:0;right:0;top:0;height:300%;pointer-events:none;
background:linear-gradient(to bottom,#cdc6bc 0 42%,rgba(205,198,188,.55) 50%,rgba(205,198,188,0) 58%)}

.printer,.shade{display:none}
.printing .printer{display:block;position:fixed;z-index:1;top:0;left:50%;width:var(--printer-w);height:var(--printer-h);
margin-left:calc(var(--printer-w) / -2);border-radius:0 0 22px 22px;overflow:hidden;
background:linear-gradient(180deg,#fdfbf7 0%,#f9f5ef 55%,#f3eee6 100%);
box-shadow:0 2px 3px rgba(60,44,34,.16),0 20px 30px -14px rgba(60,44,34,.45)}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.45;mix-blend-mode:multiply}
.logo{position:absolute;left:50%;top:calc(var(--top) + 20px);margin-left:-56px;overflow:visible}
/* Under-lip tier: a recessed band that carries the slot, with the body's rounded lower edge below it. */
.lip{position:absolute;left:0;right:0;bottom:0;height:46px;
background:linear-gradient(#e6dfd5 0,#ede7de 40%,#e9e2d8 82%,#d6cdc0 89%,#c9bfb1 100%);
box-shadow:inset 0 1px 0 rgba(80,62,48,.18),inset 0 2px 0 rgba(255,255,255,.7)}
.slot{position:absolute;left:50%;top:12px;height:9px;width:var(--slot-w,172px);margin-left:calc(var(--slot-w,172px) / -2);border-radius:2px;
background:linear-gradient(#030202 0%,#120f0d 55%,#2b2420 100%);box-shadow:inset 0 3px 3px rgba(0,0,0,.85),0 -1px 0 rgba(80,62,48,.3)}
.slot::after{content:"";position:absolute;left:-3px;right:-3px;top:100%;height:3px;border-radius:0 0 2px 2px;
background:linear-gradient(#fffdf9,#efe8de);box-shadow:0 1px 1px rgba(80,62,48,.18)}
.printing .shade{display:block;position:fixed;z-index:3;top:var(--shade-top,0);left:50%;height:14px;opacity:0;
width:var(--shade-w,120px);margin-left:calc(var(--shade-w,120px) / -2);background:linear-gradient(rgba(25,18,13,.34),rgba(25,18,13,0))}
.printing .stage{z-index:2}
.printing .paper{clip-path:inset(100% 0 0 0)}
.printing .haze{display:block;transform:translateY(-8.333%)}

.actions{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;
padding:0 16px calc(22px + var(--bottom))}
.save{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:232px;min-height:56px;padding:0 26px;
border:0;border-radius:16px;background:var(--accent);color:#fff;font:700 19px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 4px rgba(45,41,38,.16),0 14px 26px -10px rgba(143,32,28,.5);
transition:background-color .15s ease-out,transform .15s ease-out}
@media (hover:hover){.save:hover{background:#b9513f}}
.save:active{background:var(--accent-down);transform:translateY(1px)}
.save:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.save svg{width:20px;height:20px;flex:none}
.printing #download-strip,.printing .note{opacity:0}
.note{margin:0;max-width:340px;text-align:center;color:var(--muted);font-size:.86rem}
.note strong{color:var(--ink)}
.status{position:absolute;left:16px;right:16px;bottom:calc(38px + var(--bottom));margin:0;text-align:center;color:var(--muted);font-size:.95rem}
.status.error{position:static;max-width:300px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.save{transition:none}}
</style></head><body>

<filter id="emboss" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="bump"/>
<feDiffuseLighting in="bump" surfaceScale="1.9" diffuseConstant="1.55" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="235" elevation="38"/></feDiffuseLighting>
<feSpecularLighting in="bump" surfaceScale="1.9" specularConstant=".38" specularExponent="14" lighting-color="#fff" result="shine"><feDistantLight azimuth="235" elevation="38"/></feSpecularLighting>

<feColorMatrix values="0 0 0 0 .42 0 0 0 0 .36 0 0 0 0 .3 0 0 0 .16 0"/></filter>
</defs></svg>
<h1 class="sr">Your piccie photo strip</h1>
<div class="printer" aria-hidden="true">
<svg class="grain"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<svg class="logo" width="112" height="59"><g filter="url(#emboss)"><use href="#wm" width="112" height="59" fill="#faf7f2"/></g></svg>
<div class="lip"><div class="slot"></div></div>
</div>
<div class="shade" aria-hidden="true"></div>
<main class="stage"><div class="print"><div class="paper">
<img id="strip" src="__STRIP_URL__" width="600" height="1800" alt="Your piccie photo strip">
<div class="haze" aria-hidden="true"></div>
</div></div></main>
<div class="actions">
<p id="status" class="status" role="status">Loading your strip</p>
<a id="download-strip" class="save" href="__STRIP_URL__" download="piccie-photo-strip.jpg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg><span id="save-label">Download</span></a>
<button id="retry" class="save" type="button" hidden>Try again</button>
<p id="save-note" class="note" hidden>Press and hold the photo, then tap <strong>Save to Photos</strong>.</p>
</div>
<script>
(() => {
  const root = document.documentElement;
  const image = document.getElementById("strip");
  const status = document.getElementById("status");
  const button = document.getElementById("download-strip");
  const retry = document.getElementById("retry");
  const note = document.getElementById("save-note");
  const printing = root.classList.contains("printing");
  let started = false;

  const loaded = new Promise((resolve, reject) => {
    if (image.complete) return image.naturalWidth ? resolve() : reject(); // complete is also true for a broken image
    image.addEventListener("load", resolve, {once: true});
    image.addEventListener("error", reject, {once: true});
  }); // no image.decode(): it can stay pending while the page is not painting, which would hide the save button

  // Only the hidden save controls are inert during the print; the status stays audible.
  button.inert = note.inert = printing;
  setTimeout(() => {
    if (!started && !status.classList.contains("error")) {
      status.textContent = "Still loading. The signal here is slow.";
    }
  }, 4000);

  loaded.then(() => {
    started = true;
    if (!printing) {
      status.hidden = true;
      return;
    }
    status.textContent = "Printing your strip";
    try {
      printStrip();
    } catch (error) {
      // Never strand the strip or the save button behind a failed animation. No `?.` here:
      // the browsers without Web Animations are the same ones that cannot parse it.
      finish(document.getAnimations ? document.getAnimations() : []);
    }
  }, () => {
    status.textContent = "Your strip didn’t load. Check your signal, then try again.";
    status.classList.add("error");
    button.hidden = true;
    retry.hidden = false;
  });
  retry.addEventListener("click", () => location.reload());

  function finish(animations = []) {
    root.classList.remove("printing");
    status.hidden = true;
    button.inert = note.inert = false;
    for (const animation of animations) animation.cancel();
  }

  function printStrip() {
    const print = document.querySelector(".print");
    const paper = document.querySelector(".paper");
    const printer = document.querySelector(".printer");
    const shade = document.querySelector(".shade");
    const box = print.getBoundingClientRect();
    const slot = printer.querySelector(".slot").getBoundingClientRect();
    const S = 0.58;
    const dy = slot.top + slot.height / 2 - box.top;
    root.style.setProperty("--slot-w", Math.round(box.width * S + 26) + "px");
    root.style.setProperty("--shade-w", Math.round(box.width * S) + "px");
    root.style.setProperty("--shade-top", Math.round(slot.top + slot.height / 2) + "px");

    // Three feeds with a short hold between them, a small drop as the rollers let go, then the zoom.
    const T = 2050;
    const STEP = "cubic-bezier(.3,.7,.35,1)";
    const ZOOM = "cubic-bezier(.2,.75,.15,1)";
    const path = [
      [0, 0, 0, STEP], [300, .34, 0, "linear"], [390, .34, 0, STEP], [690, .68, 0, "linear"],
      [780, .68, 0, STEP], [1080, 1, 0, "cubic-bezier(.45,0,.85,.5)"], [1200, 1, 8, "linear"], [1380, 1, 8, ZOOM],
    ];
    const moves = path.map(([ms, fed, drop, easing]) => ({
      offset: ms / T, easing,
      transform: `translateY(${dy + drop}px) scale(${S}) translateY(${(fed - 1) * 100}%)`,
    }));
    moves.push({offset: 1, transform: "translateY(0px) scale(1) translateY(0%)"});
    const clips = path.map(([ms, fed, , easing]) => ({offset: ms / T, easing, clipPath: `inset(${(1 - fed) * 100}% 0% 0% 0%)`}));
    clips.push({offset: 1, clipPath: "inset(0% 0% 0% 0%)"});
    const lift = [{transform: "translateY(0)"}, {transform: `translateY(${-printer.offsetHeight - 40}px)`}];
    const liftTiming = {delay: 1380, duration: 470, easing: "cubic-bezier(.55,0,.8,.25)", fill: "forwards"};
    const rise = [{opacity: 0, transform: "translateY(16px)"}, {opacity: 1, transform: "translateY(0)"}];
    const riseTiming = {delay: 1750, duration: 380, easing: ZOOM, fill: "forwards"};

    const animations = [
      print.animate(moves, {duration: T, fill: "forwards"}),
      paper.animate(clips, {duration: T, fill: "forwards"}),
      paper.querySelector(".haze").animate(
        [{transform: "translateY(-8.333%)"}, {transform: "translateY(-58.333%)"}],
        {delay: 200, duration: 1500, easing: "cubic-bezier(.4,.1,.6,1)", fill: "forwards"},
      ),
      shade.animate(
        [{opacity: 0}, {opacity: 1, offset: .07}, {opacity: 1, offset: .53}, {opacity: 0, offset: .59}, {opacity: 0}],
        {duration: T, fill: "forwards"},
      ),
      printer.animate(lift, liftTiming),
      shade.animate(lift, liftTiming),
      status.animate([{opacity: 1}, {opacity: 0}], {delay: 1300, duration: 200, fill: "forwards"}),
      button.animate(rise, riseTiming),
      note.animate(rise, riseTiming),
    ];
    Promise.all(animations.map((animation) => animation.finished)).then(() => {
      finish(animations);
      try { localStorage.setItem("piccie-printed:" + location.pathname, "1"); } catch (error) {}
    }, () => finish(animations));
  }
})();

(() => {
  const button = document.getElementById("download-strip");
  const label = document.getElementById("save-label");
  const note = document.getElementById("save-note");
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!isIOS) return;

  button.removeAttribute("download");
  note.hidden = false;
  const imageUrl = button.href;
  if (!navigator.share || typeof File !== "function") {
    label.textContent = "Open photo";
    return;
  }

  label.textContent = "Preparing photo";
  let photoFile = null;
  fetch(imageUrl, {cache: "force-cache"})
    .then((response) => {
      if (!response.ok) throw new Error("Photo download failed");
      return response.blob();
    })
    .then((blob) => {
      const file = new File([blob], "piccie-photo-strip.jpg", {
        type: blob.type || "image/jpeg",
      });
      if (navigator.canShare && !navigator.canShare({files: [file]})) {
        throw new Error("Photo sharing is unavailable");
      }
      photoFile = file;
      label.textContent = "Save to Photos";
      note.textContent = "Tap Save to Photos, then choose Save Image.";
    })
    .catch(() => {
      label.textContent = "Open photo";
    });

  button.addEventListener("click", (event) => {
    if (!photoFile) return;
    event.preventDefault();
    navigator.share({files: [photoFile]}).catch((error) => {
      if (error.name !== "AbortError") window.location.assign(imageUrl);
    });
  });
})();
</script></body></html>
